packages:
  - packages/*
  - examples/demo
  - bench
  - fixtures/*
allowBuilds:
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - unplugin-scriptc
versioning:
  fixed:
    - ["ch3", "@ch3/val", "@ch3/unplugin"]
  changelog:
    storage: repository
