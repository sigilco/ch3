packages:
  - packages/*
  - examples/demo
  - bench
  - fixtures/*
allowBuilds:
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - unplugin-scriptc
versioning:
  fixed:
    - ["@chttp/router", "@chttp/val", "@chttp/unplugin"]
  changelog:
    storage: repository
