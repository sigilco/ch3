packages:
  - packages/*
  - examples/demo
  - examples/sse-clock
  - examples/ws-echo
  - examples/rate-limit
  - examples/backpressure
  - examples/integrations/*
  - bench
  - fixtures/*
allowBuilds:
  esbuild: true
  '@docmd/engine-rust': true
  scriptc: true
minimumReleaseAgeExclude:
  - scriptc
  - '@scriptc/*'
  - unplugin-scriptc
versioning:
  fixed:
    - ["@chttp/router", "@chttp/val", "@chttp/unplugin", "@chttp/static", "@chttp/ws", "@chttp/stream", "@chttp/html"]
  changelog:
    storage: repository
