name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Tag pushes queue here until a required reviewer approves the
    # npm-publish environment (repo Settings > Environments).
    environment: npm-publish
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r test
      # Versioning is fixed-group (pnpm-workspace.yaml versioning.fixed):
      # all four packages share one version. The release tag must match
      # the version pnpm version -r wrote into every package.json.
      - name: Verify tag matches package versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          for pkg in @chttp/router @chttp/val @chttp/unplugin @chttp/static @chttp/ws; do
            V=$(node -p "require('./packages/${pkg#@chttp/}/package.json').version")
            [ "$V" = "$TAG" ] || { echo "version mismatch: $pkg at $V, tag $TAG"; exit 1; }
          done
      - name: Publish all workspace packages
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
